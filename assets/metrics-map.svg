<svg width="1280" height="330" viewBox="0 0 1280 330" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Project evaluation metrics</title><desc id="desc">Classification is evaluated with accuracy, precision, recall, F1 score and ROC AUC. Regression is evaluated with MAE, RMSE and R squared.</desc>
<rect width="1280" height="330" rx="20" fill="#FBFDFD" stroke="#D2E5E5" stroke-width="2"/>
<text x="640" y="48" text-anchor="middle" fill="#0B3A4B" font-family="Arial, sans-serif" font-size="24" font-weight="800">EVALUATION METRICS USED IN THE PROJECT</text>
<g font-family="Arial, sans-serif" text-anchor="middle"><rect x="52" y="82" width="556" height="196" rx="17" fill="#EEF8F8" stroke="#B8DEDE" stroke-width="2"/><text x="330" y="119" fill="#0B3A4B" font-size="20" font-weight="800">Classification: Completion Status</text><g><rect x="86" y="145" width="137" height="76" rx="12" fill="#FFF"/><rect x="242" y="145" width="137" height="76" rx="12" fill="#FFF"/><rect x="398" y="145" width="137" height="76" rx="12" fill="#FFF"/><text x="154" y="174" fill="#177E89" font-size="15" font-weight="800">Accuracy</text><text x="154" y="199" fill="#52666D" font-size="12">overall correct</text><text x="310" y="174" fill="#177E89" font-size="15" font-weight="800">Precision</text><text x="310" y="199" fill="#52666D" font-size="12">trust positive</text><text x="466" y="174" fill="#177E89" font-size="15" font-weight="800">Recall</text><text x="466" y="199" fill="#52666D" font-size="12">find positives</text></g><text x="330" y="252" fill="#0B3A4B" font-size="14" font-weight="700">F1-score = balance of precision + recall  •  ROC-AUC = class separation</text>
<rect x="672" y="82" width="556" height="196" rx="17" fill="#FFF6E5" stroke="#E6CC85" stroke-width="2"/><text x="950" y="119" fill="#0B3A4B" font-size="20" font-weight="800">Regression: Final Score</text><g><rect x="706" y="145" width="137" height="76" rx="12" fill="#FFF"/><rect x="862" y="145" width="137" height="76" rx="12" fill="#FFF"/><rect x="1018" y="145" width="137" height="76" rx="12" fill="#FFF"/><text x="774" y="174" fill="#B47A08" font-size="15" font-weight="800">MAE</text><text x="774" y="199" fill="#52666D" font-size="12">average miss</text><text x="930" y="174" fill="#B47A08" font-size="15" font-weight="800">RMSE</text><text x="930" y="199" fill="#52666D" font-size="12">penalise big miss</text><text x="1086" y="174" fill="#B47A08" font-size="15" font-weight="800">R²</text><text x="1086" y="199" fill="#52666D" font-size="12">explained variation</text></g><text x="950" y="252" fill="#0B3A4B" font-size="14" font-weight="700">Lower MAE / RMSE is better  •  Higher R² is better</text></g>
</svg>
