<svg width="1280" height="500" viewBox="0 0 1280 500" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Comparison of ensemble workflows</title><desc id="desc">Visual comparison of bagging, boosting, voting and stacking methods.</desc>
<defs><marker id="ea" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#177E89"/></marker></defs>
<rect width="1280" height="500" rx="20" fill="#FBFDFD" stroke="#D2E5E5" stroke-width="2"/>
<text x="640" y="48" text-anchor="middle" fill="#0B3A4B" font-family="Arial, sans-serif" font-size="24" font-weight="800">HOW THE ENSEMBLE METHODS WORK</text>
<g font-family="Arial, sans-serif"><g><rect x="42" y="86" width="575" height="160" rx="16" fill="#EEF8F8" stroke="#B8DEDE" stroke-width="2"/><text x="70" y="119" fill="#0B3A4B" font-size="19" font-weight="800">Bagging — independent models</text><rect x="79" y="147" width="105" height="54" rx="10" fill="#FFF" stroke="#A8D9DA"/><rect x="262" y="147" width="105" height="54" rx="10" fill="#FFF" stroke="#A8D9DA"/><rect x="445" y="147" width="105" height="54" rx="10" fill="#FFF" stroke="#A8D9DA"/><text x="99" y="178" fill="#0B3A4B" font-size="13">Sample 1</text><text x="282" y="178" fill="#0B3A4B" font-size="13">Sample 2</text><text x="465" y="178" fill="#0B3A4B" font-size="13">Sample 3</text><text x="154" y="225" fill="#52666D" font-size="13">Train many trees separately → vote / average</text><g stroke="#177E89" stroke-width="2.5" marker-end="url(#ea)"><line x1="186" y1="174" x2="254" y2="174"/><line x1="369" y1="174" x2="437" y2="174"/></g></g>
<g><rect x="663" y="86" width="575" height="160" rx="16" fill="#FFF6E5" stroke="#E6CC85" stroke-width="2"/><text x="691" y="119" fill="#0B3A4B" font-size="19" font-weight="800">Boosting — sequential models</text><rect x="699" y="147" width="105" height="54" rx="10" fill="#FFF" stroke="#E9D8AA"/><rect x="882" y="147" width="105" height="54" rx="10" fill="#FFF" stroke="#E9D8AA"/><rect x="1065" y="147" width="105" height="54" rx="10" fill="#FFF" stroke="#E9D8AA"/><text x="728" y="178" fill="#0B3A4B" font-size="13">Tree 1</text><text x="911" y="178" fill="#0B3A4B" font-size="13">Tree 2</text><text x="1094" y="178" fill="#0B3A4B" font-size="13">Tree 3</text><text x="764" y="225" fill="#52666D" font-size="13">Learn from earlier errors → weighted sum</text><g stroke="#D5A43A" stroke-width="2.5" marker-end="url(#ea)"><line x1="806" y1="174" x2="874" y2="174"/><line x1="989" y1="174" x2="1057" y2="174"/></g></g>
<g><rect x="42" y="292" width="575" height="160" rx="16" fill="#FFF1EC" stroke="#F0BDAE" stroke-width="2"/><text x="70" y="325" fill="#0B3A4B" font-size="19" font-weight="800">Voting — combine different opinions</text><circle cx="142" cy="374" r="28" fill="#177E89"/><circle cx="275" cy="374" r="28" fill="#D5A43A"/><circle cx="408" cy="374" r="28" fill="#E97955"/><rect x="488" y="345" width="95" height="58" rx="11" fill="#0B3A4B"/><text x="119" y="379" fill="white" font-size="12">LR</text><text x="251" y="379" fill="white" font-size="12">RF</text><text x="383" y="379" fill="white" font-size="12">GB</text><text x="503" y="379" fill="white" font-size="12">FINAL</text><g stroke="#177E89" stroke-width="2.5" marker-end="url(#ea)"><line x1="172" y1="374" x2="476" y2="374"/><line x1="305" y1="374" x2="476" y2="374"/><line x1="438" y1="374" x2="476" y2="374"/></g></g>
<g><rect x="663" y="292" width="575" height="160" rx="16" fill="#EEF8F8" stroke="#B8DEDE" stroke-width="2"/><text x="691" y="325" fill="#0B3A4B" font-size="19" font-weight="800">Stacking — learn the combination</text><rect x="700" y="350" width="86" height="48" rx="9" fill="#FFF" stroke="#A8D9DA"/><rect x="818" y="350" width="86" height="48" rx="9" fill="#FFF" stroke="#A8D9DA"/><rect x="936" y="350" width="86" height="48" rx="9" fill="#FFF" stroke="#A8D9DA"/><rect x="1091" y="345" width="103" height="58" rx="11" fill="#0B3A4B"/><text x="724" y="379" fill="#0B3A4B" font-size="11">Base 1</text><text x="842" y="379" fill="#0B3A4B" font-size="11">Base 2</text><text x="960" y="379" fill="#0B3A4B" font-size="11">Base 3</text><text x="1104" y="379" fill="white" font-size="11">Meta model</text><g stroke="#177E89" stroke-width="2.5" marker-end="url(#ea)"><line x1="788" y1="374" x2="1079" y2="374"/><line x1="906" y1="374" x2="1079" y2="374"/><line x1="1024" y1="374" x2="1079" y2="374"/></g></g></g>
</svg>
