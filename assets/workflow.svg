<svg width="1280" height="280" viewBox="0 0 1280 280" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Smart Outcome Predictor workflow</title><desc id="desc">CSV data is prepared, split, modeled with ensembles, evaluated and then used for insight.</desc>
<defs><linearGradient id="bgw" x1="0" y1="0" x2="1280" y2="280" gradientUnits="userSpaceOnUse"><stop stop-color="#F1FAFA"/><stop offset="1" stop-color="#FFF8E7"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#177E89"/></marker></defs>
<rect width="1280" height="280" rx="20" fill="url(#bgw)"/>
<text x="640" y="43" text-anchor="middle" fill="#0B3A4B" font-family="Arial, sans-serif" font-size="22" font-weight="800">FROM STUDENT DATA TO ACTIONABLE OUTCOMES</text>
<g font-family="Arial, sans-serif" text-anchor="middle"><g><rect x="48" y="103" width="183" height="100" rx="17" fill="#FFF" stroke="#B9DCDD" stroke-width="2"/><circle cx="139" cy="126" r="18" fill="#177E89"/><text x="139" y="132" fill="white" font-size="14" font-weight="700">1</text><text x="139" y="164" fill="#0B3A4B" font-size="16" font-weight="700">Load dataset</text><text x="139" y="186" fill="#52666D" font-size="13">5,200 student records</text></g>
<g><rect x="289" y="103" width="183" height="100" rx="17" fill="#FFF" stroke="#B9DCDD" stroke-width="2"/><circle cx="380" cy="126" r="18" fill="#177E89"/><text x="380" y="132" fill="white" font-size="14" font-weight="700">2</text><text x="380" y="164" fill="#0B3A4B" font-size="16" font-weight="700">Prepare data</text><text x="380" y="186" fill="#52666D" font-size="13">impute · encode · scale</text></g>
<g><rect x="530" y="103" width="183" height="100" rx="17" fill="#FFF" stroke="#B9DCDD" stroke-width="2"/><circle cx="621" cy="126" r="18" fill="#D5A43A"/><text x="621" y="132" fill="#FFF" font-size="14" font-weight="700">3</text><text x="621" y="164" fill="#0B3A4B" font-size="16" font-weight="700">Train models</text><text x="621" y="186" fill="#52666D" font-size="13">bagging · boosting</text></g>
<g><rect x="771" y="103" width="183" height="100" rx="17" fill="#FFF" stroke="#B9DCDD" stroke-width="2"/><circle cx="862" cy="126" r="18" fill="#E97955"/><text x="862" y="132" fill="white" font-size="14" font-weight="700">4</text><text x="862" y="164" fill="#0B3A4B" font-size="16" font-weight="700">Evaluate</text><text x="862" y="186" fill="#52666D" font-size="13">F1 · ROC-AUC · R²</text></g>
<g><rect x="1012" y="103" width="220" height="100" rx="17" fill="#0B3A4B"/><circle cx="1122" cy="126" r="18" fill="#37BBC5"/><text x="1122" y="132" fill="white" font-size="14" font-weight="700">5</text><text x="1122" y="164" fill="white" font-size="16" font-weight="700">Predict outcomes</text><text x="1122" y="186" fill="#D4F1F0" font-size="13">completion + final score</text></g></g>
<g stroke="#177E89" stroke-width="3" marker-end="url(#arrow)"><line x1="233" y1="153" x2="281" y2="153"/><line x1="474" y1="153" x2="522" y2="153"/><line x1="715" y1="153" x2="763" y2="153"/><line x1="956" y1="153" x2="1004" y2="153"/></g>
</svg>
