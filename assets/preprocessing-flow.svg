<svg width="1280" height="440" viewBox="0 0 1280 440" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Data preprocessing pipeline</title><desc id="desc">Flow from raw student data through feature engineering, numeric and categorical preprocessing, to train and test data.</desc>
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1280" y2="440" gradientUnits="userSpaceOnUse"><stop stop-color="#F7FCFC"/><stop offset="1" stop-color="#FFF9EB"/></linearGradient>
    <marker id="pa" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#177E89"/></marker>
  </defs>
  <rect width="1280" height="440" rx="20" fill="url(#pbg)"/>
  <text x="640" y="48" text-anchor="middle" fill="#0B3A4B" font-family="Arial, sans-serif" font-size="24" font-weight="800">DATA PREPARATION PIPELINE</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="44" y="167" width="175" height="90" rx="16" fill="#0B3A4B"/>
    <text x="131" y="201" fill="white" font-size="16" font-weight="700">Raw CSV</text><text x="131" y="225" fill="#D5F0EF" font-size="13">5,200 × 19</text>
    <rect x="291" y="167" width="190" height="90" rx="16" fill="#E7F6F5" stroke="#A8D9DA" stroke-width="2"/>
    <text x="386" y="197" fill="#0B3A4B" font-size="16" font-weight="700">Clean + engineer</text><text x="386" y="222" fill="#52666D" font-size="13">drop ID · make month/day</text>
    <rect x="555" y="61" width="218" height="90" rx="16" fill="#FDF4DC" stroke="#E7CD86" stroke-width="2"/>
    <text x="664" y="91" fill="#0B3A4B" font-size="16" font-weight="700">Numeric columns</text><text x="664" y="116" fill="#52666D" font-size="13">median fill + standard scale</text>
    <rect x="555" y="273" width="218" height="90" rx="16" fill="#FFF1EC" stroke="#F0BDAD" stroke-width="2"/>
    <text x="664" y="303" fill="#0B3A4B" font-size="16" font-weight="700">Text columns</text><text x="664" y="328" fill="#52666D" font-size="13">most-frequent fill + one-hot</text>
    <rect x="853" y="167" width="190" height="90" rx="16" fill="#E7F6F5" stroke="#A8D9DA" stroke-width="2"/>
    <text x="948" y="197" fill="#0B3A4B" font-size="16" font-weight="700">ColumnTransformer</text><text x="948" y="222" fill="#52666D" font-size="13">one safe preprocessing object</text>
    <rect x="1111" y="167" width="132" height="90" rx="16" fill="#177E89"/>
    <text x="1177" y="197" fill="white" font-size="16" font-weight="700">80 / 20</text><text x="1177" y="222" fill="#E7FFFE" font-size="13">train / test</text>
    <text x="664" y="183" fill="#177E89" font-size="12" font-weight="700">NUMERIC BRANCH</text><text x="664" y="246" fill="#177E89" font-size="12" font-weight="700">CATEGORICAL BRANCH</text>
  </g>
  <g stroke="#177E89" stroke-width="3" marker-end="url(#pa)"><line x1="221" y1="212" x2="283" y2="212"/><line x1="483" y1="199" x2="545" y2="120"/><line x1="483" y1="225" x2="545" y2="303"/><line x1="775" y1="120" x2="844" y2="190"/><line x1="775" y1="303" x2="844" y2="234"/><line x1="1045" y1="212" x2="1103" y2="212"/></g>
  <text x="640" y="405" text-anchor="middle" fill="#52666D" font-family="Arial, sans-serif" font-size="14">All preprocessing learns its rules from training data only — this helps prevent data leakage.</text>
</svg>
